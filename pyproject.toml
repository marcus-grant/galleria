[project]
name = "galleria"
version = "0.1.0"
description = "Static web photo gallery generator"
license = "AGPL-3.0-or-later"
requires-python = ">=3.12"
dependencies = [
    "pillow",
    "exifread",
    "python-dotenv",
    "boto3",
    "markdown",
    "click",
    "timezonefinder>=6.0.0",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "pytest-mock",
    "pyfakefs",
    "ruff",
    "piexif>=1.1.3",
    "moto[s3]",
    "beautifulsoup4",
    "watchdog>=6.0.0",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
extend-exclude = ["salvage"]
target-version = "py312"

[tool.pyright]
venvPath = "."
venv = ".venv"
include = ["src/galleria", "test", "manage.py"]
exclude = ["salvage", "**/__pycache__"]

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["src", "."]
