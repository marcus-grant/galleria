[project]
name = "galleria"
version = "0.0.4"
description = "Static web photo gallery generator"
license = "AGPL-3.0-or-later"
requires-python = ">=3.12"
dependencies = [
    "pillow",
    "click",
    "jinja2",
    "b3c32>=0.0.3,<0.1.0",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "pytest-mock",
    "pyfakefs",
    "ruff",
    "beautifulsoup4",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
galleria = ["template/**/*.html"]

[tool.ruff]
line-length = 88
extend-exclude = ["salvage"]
target-version = "py312"

[tool.pyright]
venvPath = "."
venv = ".venv"
include = ["src/galleria", "test"]
exclude = ["salvage", "**/__pycache__"]

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["src"]
