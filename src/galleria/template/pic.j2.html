{% extends "base.j2.html" %}

{% block title %}{{ pic.key.name }} - {{ collection }} Gallery{% endblock %}

{% block content %}
<div class="container">
  <nav class="pager">
    {% if prev %}
    <a rel="prev" href="{{ prev.key.name }}.html" class="pager__prev button">Previous</a>
    {% endif %}
    <a href="../index.html" class="pager__up button">Back to gallery</a>
    {% if next %}
    <a rel="next" href="{{ next.key.name }}.html" class="pager__next button">Next</a>
    {% endif %}
  </nav>
  <figure class="frame">
    <img
      src="{{ root }}/{{ href(collection, pic.display) }}"
      alt="{{ collection }} {{ pic.key.name }}"
      class="frame__img"
    />
  </figure>
  <div class="button-group">
    <a href="{{ root }}/{{ href(collection, pic.original) }}" class="button">View original</a>
    <a href="{{ root }}/{{ href(collection, pic.original) }}" class="button button--primary" download>Download</a>
  </div>
</div>
{% endblock %}
<!-- END: src/template/pic.j2.html -->
