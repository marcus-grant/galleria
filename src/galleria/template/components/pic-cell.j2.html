<div class="pic-cell">
  <a href="pic/{{ pic.key.name }}.html" class="block aspect-square">
    <img
      src="{{ root }}/{{ href(collection, pic.thumb) }}"
      alt="{{ collection }} {{ pic.key.name }}"
      loading="lazy"
      class="w-full h-full object-cover rounded-lg hover:shadow-lg transition-shadow"
    />
  </a>
</div>
