<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>{% block title %}Wedding Gallery{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --pic-placeholder-bg: #e5e7eb;
      --pic-cell-radius: 0.5rem;
    }

    .pic-cell__link {
      background: var(--pic-placeholder-bg);
      border-radius: var(--pic-cell-radius);
    }

    .pic-cell__img {
      color: transparent;
    }
  </style>
  {% block head %}{% endblock %}
</head>
<body class="bg-gray-50">
  {% include 'components/navbar.j2.html' %}
  
  <main>
    {% block content %}{% endblock %}
  </main>
  
  {% block scripts %}{% endblock %}
</body>
</html>
<!-- END: src/template/base.j2.html -->
